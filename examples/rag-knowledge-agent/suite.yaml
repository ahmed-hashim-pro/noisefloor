# Targets github.com/ahmed-hashim-pro/rag-knowledge-agent unmodified.
#
#   cd ../rag-knowledge-agent && pip install -e . && rag ingest sample_corpus
#   noisefloor check examples/rag-knowledge-agent/suite.yaml
#
# A baseline is committed under baseline/ -- see README.md and
# docs/design-notes.md section 8 for the measured write-up. It was captured
# at 3 repeats per case rather than this file's default of 5, to limit API
# spend (15 model calls, not 25). Regenerating it, or diffing against it with
# a fresh run at this file's defaults, needs ANTHROPIC_API_KEY; reading the
# committed baseline does not.
#
# The `allowed` lists below came from running rag-knowledge-agent's own
# retrieval (the target project, not noisefloor) offline, no API key needed,
# over each case's input, and recording the sources it actually returned —
# `sample_corpus/`-prefix and all, since citation `source` values are
# repo-relative paths, not bare filenames. Do not "tidy" these back to bare
# filenames or widen them past what was measured: a source outside the list
# should fail the scorer, visibly, so it can be reviewed and the list
# widened deliberately.
name: rag-knowledge-agent
target:
  command: ["rag", "ask", "--json", "{{input}}"]
  cwd: ../../../rag-knowledge-agent   # relative to this file
  timeout_s: 120
defaults:
  repeats: 5

cases:
  - id: offline-behaviour
    input: |
      A Meridian-3 has stopped reporting. How long can it keep working
      offline, and how would I detect that from the Fleet Control API?
    scorers:
      - json_valid
      - {type: json_path_in, path: confidence, values: [high, medium]}
      # measured sources for this input; see the header note.
      - {type: json_path_subset, path: "citations[].source",
         allowed: [sample_corpus/api-reference.md, sample_corpus/faq.md,
                   sample_corpus/product-specs.md, sample_corpus/support-runbook.md]}
      - {type: contains, needle: "offline", path: answer}

  - id: charging-bays
    input: How many charging bays should we provision for a two-shift operation?
    scorers:
      - json_valid
      - {type: json_path_in, path: confidence, values: [high, medium]}
      - {type: json_path_number, path: "citations[].score", min: 0.35}

  - id: error-code-409
    input: Why did my task cancellation return 409?
    scorers:
      - json_valid
      - {type: contains, needle: "409", path: answer}
      # measured sources for this input; see the header note.
      - {type: json_path_subset, path: "citations[].source",
         allowed: [sample_corpus/api-reference.md, sample_corpus/faq.md,
                   sample_corpus/support-runbook.md]}

  - id: refuses-parental-leave
    # Retrieves at top score 0.436, above the 0.35 confidence floor, so this
    # is not gated to the canned refusal — the model must decide on its own
    # whether the (off-topic) retrieved context supports an answer. Measured
    # (see README.md / docs/design-notes.md §8): it refuses cleanly, low
    # confidence, zero citations, 3/3 on every scorer, every repeat.
    input: What is Acme Robotics' parental leave policy?
    scorers:
      - json_valid
      - {type: contains, needle: "I don't know", path: answer}
      - {type: json_path_equals, path: confidence, value: low}

  - id: refuses-off-domain
    input: What is the recipe for sourdough bread?
    scorers:
      - json_valid
      - {type: json_path_equals, path: confidence, value: low}
      - {type: not_contains, needle: "flour", path: answer}
